name: Delete superseded California and Utah zoom-13 maps

# Temporary one-time cleanup. The only writable effect is deleting these two
# literal z13 release tags after checking the replacement z14 assets are present.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-legacy-zoom13-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-old-map-releases:
    if: github.repository == 'ItzCrim/Zenith-Repo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify both replacement zoom-14 packages are published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for state in california utah; do
            tag="map-north-america-us-${state}-z14"
            assets="$(gh release view "$tag" --repo "$GH_REPO" --json assets --jq '.assets[].name')"
            grep -Fxq "${state}.pmtiles" <<< "$assets"
            grep -Fxq "${state}.pmtiles.sha256" <<< "$assets"
            echo "Confirmed $tag has map and checksum"
          done

      - name: Delete only the two obsolete zoom-13 Releases and their tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for state in california utah; do
            tag="map-north-america-us-${state}-z13"
            if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GH_REPO" --yes --cleanup-tag
              echo "Deleted obsolete Release $tag"
            else
              echo "Already absent: $tag"
            fi
          done
          for state in california utah; do
            tag="map-north-america-us-${state}-z14"
            gh release view "$tag" --repo "$GH_REPO" >/dev/null
            echo "Kept zoom-14 Release $tag"
          done
