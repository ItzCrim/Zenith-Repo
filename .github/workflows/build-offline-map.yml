name: Build and publish Zenith offline map

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Geofabrik region like europe/monaco or north-america/us/arizona"
        required: true
        type: string
        default: "europe/monaco"
      max_zoom:
        description: "Maximum tile zoom (11-14). Lower saves storage; 14 is more detailed."
        required: true
        type: choice
        options: ["11", "12", "13", "14"]
        default: "13"

  workflow_call:
    inputs:
      region:
        description: "Geofabrik region such as north-america/us/arizona"
        required: true
        type: string
      max_zoom:
        description: "Maximum tile zoom, from 11 to 14"
        required: true
        type: string
      skip_existing:
        description: "Skip when an existing Release already has PMTiles and checksum"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Don't allow two builds to overwrite the same region release simultaneously.
concurrency:
  group: offline-map-${{ inputs.region }}-z${{ inputs.max_zoom }}
  cancel-in-progress: false

jobs:
  check-release:
    name: Check existing published package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.inspect.outputs.build }}
      artifact: ${{ steps.inspect.outputs.artifact }}
    steps:
      - name: Check region and Release assets
        id: inspect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REGION: ${{ inputs.region }}
          MAX_ZOOM: ${{ inputs.max_zoom }}
          SKIP_EXISTING: ${{ inputs.skip_existing }}
        run: |
          set -euo pipefail
          [[ "$REGION" =~ ^[a-z0-9]+([/-][a-z0-9]+)*$ ]] || {
            echo "::error::Invalid Geofabrik region"; exit 1;
          }
          [[ "$MAX_ZOOM" =~ ^(11|12|13|14)$ ]] || {
            echo "::error::Zoom must be between 11 and 14"; exit 1;
          }
          REGION_NAME="$(basename "$REGION")"
          TAG="map-${REGION//\//-}-z$MAX_ZOOM"
          echo "artifact=verified-zenith-$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$SKIP_EXISTING" == "true" ]]; then
            ASSETS="$(mktemp)"
            if gh release view "$TAG" --repo "$GH_REPO" \
              --json assets --jq '.assets[].name' > "$ASSETS" 2>/dev/null; then
              if grep -Fxq "$REGION_NAME.pmtiles" "$ASSETS" && \
                 grep -Fxq "$REGION_NAME.pmtiles.sha256" "$ASSETS"; then
                echo "build=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Skipping existing $TAG (raw map and checksum published)"
                exit 0
              fi
            fi
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "Building $TAG"

  offline-basemap:
    needs: check-release
    if: needs.check-release.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Validate selected region
        shell: bash
        env:
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          [[ "$REGION" =~ ^[a-z0-9]+([/-][a-z0-9]+)*$ ]] || exit 1
          echo "REGION_NAME=$(basename "$REGION")" >> "$GITHUB_ENV"
          echo "PBF_URL=https://download.geofabrik.de/$REGION-latest.osm.pbf" >> "$GITHUB_ENV"

      - name: Download source OSM extract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 40 \
            --max-time 2100 --max-filesize 1600000000 "$PBF_URL" -o region.osm.pbf
          test -s region.osm.pbf

      - name: Generate OpenMapTiles-schema PMTiles
        shell: bash
        env:
          MAX_ZOOM: ${{ inputs.max_zoom }}
        run: |
          set -euo pipefail
          mkdir -p output
          # OSM schema MUST match the existing OpenFreeMap Liberty style.
          # Protomaps / Shortbread .pmtiles are incompatible with it.
          docker run --rm -v "$PWD:/work" -w /work \
            --memory=7g \
            openmaptiles/planetiler-openmaptiles:latest \
            --force --download --osm_path=/work/region.osm.pbf \
            --output=/work/output/map.pmtiles --maxzoom="$MAX_ZOOM"
          test -s output/map.pmtiles
          cp output/map.pmtiles "output/$REGION_NAME.pmtiles"

      - name: Verify PMTiles and prepare checksum
        shell: bash
        run: |
          set -euo pipefail
          FILE="output/$REGION_NAME.pmtiles"
          python3 - "$FILE" <<'PY'
          import gzip, json, pathlib, struct, sys
          p = pathlib.Path(sys.argv[1])
          with p.open("rb") as f:
              h = f.read(127)
              if len(h) != 127 or h[:7] != b"PMTiles" or h[7] != 3 or h[99] != 1:
                  raise SystemExit("Not a PMTiles v3 vector basemap")
              offset, length = struct.unpack_from("<QQ", h, 24)
              if offset < 127 or length > 2_000_000 or offset + length > p.stat().st_size:
                  raise SystemExit("Invalid PMTiles metadata bounds")
              f.seek(offset)
              raw = f.read(length)
              if h[97] == 2:
                  raw = gzip.decompress(raw)
              elif h[97] != 1:
                  raise SystemExit("Unsupported metadata compression")
              layers = {x.get("id") for x in json.loads(raw).get("vector_layers", [])}
              missing = {"transportation", "building", "water", "place"} - layers
              if missing:
                  raise SystemExit(f"Not OpenMapTiles compatible; missing layers: {sorted(missing)}")
          # A release asset must be smaller than GitHub's 2 GiB asset limit.
          if p.stat().st_size >= 2 * 1024**3:
              raise SystemExit("Map exceeds GitHub Releases 2 GiB single-asset limit")
          print(f"Verified: {p.name} ({p.stat().st_size} bytes)")
          PY
          (cd output && sha256sum "$REGION_NAME.pmtiles" > "$REGION_NAME.pmtiles.sha256")

      # Keep the verified result as a workflow artifact BEFORE publishing.
      # A release failure can then be retried without rebuilding all map tiles.
      - name: Save verified map for publishing retries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check-release.outputs.artifact }}
          path: |
            output/*.pmtiles
            output/*.pmtiles.sha256
          retention-days: 7
          if-no-files-found: error

  publish-release:
    name: Publish map to public Releases
    needs: [check-release, offline-basemap]
    if: needs.check-release.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository for GitHub CLI
        uses: actions/checkout@v4

      - name: Restore verified map without rebuilding
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.check-release.outputs.artifact }}
          path: output

      - name: Publish raw PMTiles and checksum to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REGION: ${{ inputs.region }}
          MAX_ZOOM: ${{ inputs.max_zoom }}
        run: |
          set -euo pipefail
          REGION_NAME="$(basename "$REGION")"
          TAG="map-${REGION//\//-}-z$MAX_ZOOM"
          TITLE="Zenith offline map — $REGION (z$MAX_ZOOM)"
          test -s "output/$REGION_NAME.pmtiles"
          test -s "output/$REGION_NAME.pmtiles.sha256"
          if ! gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GH_REPO" --title "$TITLE" --latest=false \
              --notes "Offline OpenMapTiles vector basemap for Zenith. Source: Geofabrik OpenStreetMap data ($REGION). Max tile zoom $MAX_ZOOM. Map geometry only; offline routing requires a separate Valhalla pack. ODbL attribution: © OpenStreetMap contributors (https://www.openstreetmap.org/copyright)."
          fi
          # Release assets are raw PMTiles files, not zipped workflow artifacts.
          gh release upload "$TAG" --repo "$GH_REPO" \
            "output/$REGION_NAME.pmtiles" \
            "output/$REGION_NAME.pmtiles.sha256" --clobber
          echo "Published https://github.com/$GH_REPO/releases/tag/$TAG"
