name: Build Complete US Connected Valhalla Routing Graph

# All 50 states (including Alaska and Hawaii) come from ONE Geofabrik US
# source, resulting in ONE coherent Valhalla graph. Shards are distribution
# files, never independently compiled routing graphs.
on:
  workflow_dispatch:
    inputs:
      runner_mode:
        description: "Use an owned Linux runner (no GitHub larger-runner fees), or an eligible larger runner"
        required: true
        type: choice
        options: ["self-hosted", "github-large"]
        default: "self-hosted"
      memory_gib:
        description: "Approximate host RAM in GiB; build container uses 3 GiB less. 16 is unverified for all USA."
        required: true
        type: choice
        options: ["8", "12", "16", "24", "32", "48", "64", "96"]
        default: "16"
      build_threads:
        description: "Valhalla tile-build worker threads; fewer means lower memory and longer runtime"
        required: true
        type: choice
        options: ["1", "2", "4"]
        default: "1"
      tile_cache_mib:
        description: "Per-worker Valhalla tile cache in MiB (not total peak process memory)"
        required: true
        type: choice
        options: ["32", "64", "128", "256"]
        default: "64"
      min_parts:
        description: "Minimum number of complementary download packages"
        required: true
        type: choice
        options: ["32", "64", "96", "128"]
        default: "64"
      source:
        description: "USA source coverage"
        required: true
        type: choice
        options: ["north-america/us"]
        default: "north-america/us"

permissions:
  contents: write

concurrency:
  group: us-valhalla-connected-z1
  cancel-in-progress: false

jobs:
  build-us-connected-valhalla:
    # A registered self-hosted runner can have modest RAM and a LARGE SSD.
    # Standard GitHub-hosted runners lack the scratch disk for this build.
    # Larger runners require separate eligibility and may incur fees.
    runs-on: ${{ fromJSON(inputs.runner_mode == 'self-hosted' && '["self-hosted","linux","x64","zenith-us-routing"]' || '"ubuntu-24.04-32core"') }}
    # GitHub limits self-hosted jobs to five days, hosted jobs to six hours.
    # Low-RAM national builds may still OOM, run out of disk, or exceed this.
    timeout-minutes: ${{ inputs.runner_mode == 'self-hosted' && 7000 || 360 }}
    env:
      GRAPH_NAME: usa-connected
      CATALOG: north-america/us
      PART_MIN: ${{ inputs.min_parts }}
      HOST_RAM_GIB: ${{ inputs.memory_gib }}
      BUILD_THREADS: ${{ inputs.build_threads }}
      TILE_CACHE_MIB: ${{ inputs.tile_cache_mib }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check adjustable memory budget and large scratch disk
        shell: bash
        run: |
          set -euo pipefail
          case "$HOST_RAM_GIB" in 8|12|16|24|32|48|64|96) ;; *) exit 1;; esac
          case "$BUILD_THREADS" in 1|2|4) ;; *) exit 1;; esac
          case "$TILE_CACHE_MIB" in 32|64|128|256) ;; *) exit 1;; esac
          command -v docker >/dev/null || { echo "::error::Docker is required"; exit 1; }
          memory_kb=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)
          disk_kb=$(df -Pk "$PWD" | awk 'NR==2 {print $4}')
          container_ram=$((HOST_RAM_GIB-3))
          echo "Installed RAM: $((memory_kb / 1024 / 1024)) GiB"
          echo "Requested host profile: ${HOST_RAM_GIB} GiB, Docker cap: ${container_ram} GiB"
          echo "Build workers: $BUILD_THREADS, tile cache per worker: $TILE_CACHE_MIB MiB"
          echo "Available scratch disk: $((disk_kb / 1024 / 1024)) GiB"
          # RAM sizes sold as 16GB often report slightly less in /proc/meminfo.
          if (( memory_kb < HOST_RAM_GIB * 1024 * 1024 * 90 / 100 )); then
            echo "::error::The selected RAM profile exceeds the actual host memory."
            exit 1
          fi
          if (( disk_kb < 300000000 )); then
            echo "::error::At least ~286 GiB of available scratch disk is required for this experimental full-US build. This check is independent of RAM."
            exit 1
          fi
          echo "CONTAINER_RAM_GIB=$container_ram" >> "$GITHUB_ENV"
          {
            echo "### Experimental resource budget"
            echo "- RAM profile: ${HOST_RAM_GIB} GiB; container limit: ${container_ram} GiB"
            echo "- Valhalla build threads: ${BUILD_THREADS}"
            echo "- Graph cache: ${TILE_CACHE_MIB} MiB per thread"
            echo "- Scratch free: $((disk_kb / 1024 / 1024)) GiB"
            echo "- This is a resource cap, **not** proof that full-USA graph building can succeed at the chosen RAM level."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Download single complete US OpenStreetMap extract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pbfs
          curl --fail --location --retry 5 --retry-delay 20 --connect-timeout 60 \
            --speed-time 120 --speed-limit 1000 --max-time 10800 \
            "https://download.geofabrik.de/north-america/us-latest.osm.pbf" \
            -o pbfs/usa.osm.pbf
          test -s pbfs/usa.osm.pbf
          sha256sum pbfs/usa.osm.pbf | tee pbfs/source.sha256
          source_sha="$(cut -c1-20 pbfs/source.sha256)"
          echo "GRAPH_SET=route-usa-$source_sha" >> "$GITHUB_ENV"
      - name: Generate low-memory Valhalla build configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tiles
          # Redirect on the host to avoid root-owned valhalla.json on Docker mounts.
          docker run --rm --memory "${CONTAINER_RAM_GIB}g" \
            --memory-swap "${CONTAINER_RAM_GIB}g" \
            --cpus "$BUILD_THREADS" --entrypoint valhalla_build_config \
            -v "$PWD:/work" -w /work ghcr.io/valhalla/valhalla:3.9.0 \
            --mjolnir-tile-dir /work/tiles \
            --mjolnir-tile-extract /work/valhalla_tiles.tar \
            --mjolnir-timezone /work/tiles/timezones.sqlite \
            --mjolnir-admin /work/tiles/admins.sqlite > valhalla.json
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path("valhalla.json")
          config = json.loads(path.read_text())
          mj = config["mjolnir"]
          mj["concurrency"] = int(os.environ["BUILD_THREADS"])
          mj["max_cache_size"] = int(os.environ["TILE_CACHE_MIB"]) * 1024 * 1024
          mj["use_lru_mem_cache"] = True
          mj["lru_mem_cache_hard_control"] = True
          path.write_text(json.dumps(config, indent=2)+"\n")
          print("Valhalla configuration:", {
              key: mj[key] for key in (
                  "concurrency", "max_cache_size",
                  "use_lru_mem_cache", "lru_mem_cache_hard_control"
              )
          })
          PY
      - name: Build ONE connected Valhalla graph under the memory cap
        shell: bash
        run: |
          set -euo pipefail
          # One nationwide OSM input yields one coherent graph; don't merge
          # separately compiled state graphs and claim interstate continuity.
          set +e
          docker run --rm --memory "${CONTAINER_RAM_GIB}g" \
            --memory-swap "${CONTAINER_RAM_GIB}g" \
            --cpus "$BUILD_THREADS" --entrypoint /bin/bash \
            -v "$PWD:/work" -w /work ghcr.io/valhalla/valhalla:3.9.0 -lc '
              set -euo pipefail
              valhalla_build_timezones > /work/tiles/timezones.sqlite
              valhalla_build_admins -c /work/valhalla.json /work/pbfs/usa.osm.pbf
              valhalla_build_tiles -c /work/valhalla.json /work/pbfs/usa.osm.pbf
              count="$(find /work/tiles -name "*.gph" | wc -l)"
              test "$count" -gt 1000
              echo "Generated $count connected routing graph tiles"
            '
          status=$?
          set -e
          if (( status != 0 )); then
            if (( status == 137 )); then
              echo "::error::Valhalla exceeded this RAM cap (exit 137). Try a larger memory profile; cache size and threads do not bound ALL build allocations."
            else
              echo "::error::Valhalla build failed (exit $status). Check graph-builder logs, free disk and resource limits."
            fi
            exit "$status"
          fi
      - name: Create size-balanced complementary route downloads
        shell: bash
        run: |
          set -euo pipefail
          python tools/package_connected_valhalla.py \
            --tiles tiles --output output \
            --name "$GRAPH_NAME" --region "$CATALOG" \
            --graph-set "$GRAPH_SET" --parts "$PART_MIN" \
            --auto-max-raw-bytes 1400000000
          count="$(cat output/parts.txt)"
          test "$count" -ge "$PART_MIN"
          test "$count" -le 128
          echo "PART_COUNT=$count" >> "$GITHUB_ENV"
          echo "Publishing $count pieces of one fully connected US graph"
      - name: Publish every part into Zenith-Repo Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for index in $(seq 1 "$PART_COUNT"); do
            file="$GRAPH_NAME-part-$index.crimroute"
            tag="route-$GRAPH_NAME-v2-$GRAPH_SET-part-$index"
            test -s "output/$file"
            test -s "output/$file.sha256"
            notes="Entire United States Valhalla routing graph. Source: Geofabrik OpenStreetMap data (north-america/us), compiled TOGETHER as one graph. Compatible graph_set=$GRAPH_SET. ALL $PART_COUNT complementary packages are REQUIRED for full-US interstate routing. © OpenStreetMap contributors, ODbL 1.0."
            if ! gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$GH_REPO" --latest=false \
                --title "Zenith US Valhalla routes — part $index of $PART_COUNT" \
                --notes "$notes"
            fi
            gh release upload "$tag" --repo "$GH_REPO" \
              "output/$file" "output/$file.sha256" --clobber
          done
          echo "Published $PART_COUNT compatible routing packages to $GH_REPO"
