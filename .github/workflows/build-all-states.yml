name: Build All US State Offline Maps

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Run the 1-state trial first; full run may use many build minutes"
        type: choice
        options:
          - test_delaware
          - all_50_states
        default: test_delaware
        required: true

# The called workflow publishes releases using this repository's GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  choose-regions:
    name: Select requested regions
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.select.outputs.regions }}
    steps:
      - name: Select one test state or all 50
        id: select
        shell: bash
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          if [[ "$SCOPE" == "test_delaware" ]]; then
            echo 'regions=["north-america/us/delaware"]' >> "$GITHUB_OUTPUT"
          elif [[ "$SCOPE" == "all_50_states" ]]; then
            echo 'regions=["north-america/us/alabama","north-america/us/alaska","north-america/us/arizona","north-america/us/arkansas","north-america/us/california","north-america/us/colorado","north-america/us/connecticut","north-america/us/delaware","north-america/us/florida","north-america/us/georgia","north-america/us/hawaii","north-america/us/idaho","north-america/us/illinois","north-america/us/indiana","north-america/us/iowa","north-america/us/kansas","north-america/us/kentucky","north-america/us/louisiana","north-america/us/maine","north-america/us/maryland","north-america/us/massachusetts","north-america/us/michigan","north-america/us/minnesota","north-america/us/mississippi","north-america/us/missouri","north-america/us/montana","north-america/us/nebraska","north-america/us/nevada","north-america/us/new-hampshire","north-america/us/new-jersey","north-america/us/new-mexico","north-america/us/new-york","north-america/us/north-carolina","north-america/us/north-dakota","north-america/us/ohio","north-america/us/oklahoma","north-america/us/oregon","north-america/us/pennsylvania","north-america/us/rhode-island","north-america/us/south-carolina","north-america/us/south-dakota","north-america/us/tennessee","north-america/us/texas","north-america/us/utah","north-america/us/vermont","north-america/us/virginia","north-america/us/washington","north-america/us/west-virginia","north-america/us/wisconsin","north-america/us/wyoming"]' >> "$GITHUB_OUTPUT"
          else
            echo "::error::Invalid requested scope"
            exit 1
          fi

  build-all-states:
    name: ${{ matrix.region }}
    needs: choose-regions
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        region: ${{ fromJSON(needs.choose-regions.outputs.regions) }}
    uses: ./.github/workflows/build-offline-map.yml
    with:
      region: ${{ matrix.region }}
      max_zoom: "14"
      skip_existing: true
